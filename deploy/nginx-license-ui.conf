# TLS reverse proxy in front of run_web.py (started with --host 127.0.0.1 --trust-proxy --secure-cookies).
# http context: one zone for the sign-in page, one for connections per client.
limit_req_zone  $binary_remote_addr zone=lic_login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=lic_conn:1m;

server {
    listen 80;
    server_name licence-reports.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name licence-reports.example.internal;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/licence-reports.crt;
    ssl_certificate_key /etc/nginx/ssl/licence-reports.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size    1m;
    client_body_timeout     10s;
    client_header_timeout   10s;
    limit_conn              lic_conn 20;

    location = /login {
        limit_req zone=lic_login burst=5 nodelay;
        include /etc/nginx/licui-proxy.inc;
    }
    location / {
        include /etc/nginx/licui-proxy.inc;
    }
}

