# Optional TLS reverse proxy in front of run_web.py (started with --trust-proxy --secure-cookies).
server {
    listen 443 ssl;
    server_name licence-reports.example.internal;

    ssl_certificate     /etc/nginx/ssl/licence-reports.crt;
    ssl_certificate_key /etc/nginx/ssl/licence-reports.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
