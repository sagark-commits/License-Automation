# TMONE License Utilization - tenant registry
# arc: ARC-1 = Ameyo VPC  |  ARC-2 = Ameyo BPO

defaults:
  # ---------------------------------------------------------------------------
  # USER TYPE RULES (production)
  # ---------------------------------------------------------------------------
  # Classification (CSV/DB -> license bucket):
  #   agent_user_types      -> counted as AGENT peak (Professional-Agent, Executive, ...)
  #   supervisor_user_types -> counted as SUPERVISOR (shown as-is)
  #   wallboard_user_types  -> counted as WALLBOARD (shown as-is)
  #
  # Display on Excel sheets:
  #   tenant_sheet_agent_label  -> default name for agent rows (Professional-Agent)
  #   Per tenant you can override with:
  #     agent_display_label: "Ameyo Pro-Dialer"
  #     display_labels: { agent: "...", supervisor: "...", wallboard: "..." }
  #     agent_user_types: [Professional-Agent, Executive]   # optional per-tenant list
  # ---------------------------------------------------------------------------
  agent_user_types:
    - Professional-Agent
    - Ameyo-express
    - Executive
  supervisor_user_types:
    - Supervisor
  wallboard_user_types:
    - Wallboard User
    - Wallboard
    - Wallboard-User
  wallboard_filename_patterns:
    - wallboard
    - Wallboard
  license_labels:
    agent: Professional-Agent
    supervisor: Supervisor
    wallboard: Wallboard User
  tenant_sheet_agent_label: Professional-Agent
  # Active contact centers (from call_history query on oneproduct)
  active_contact_centers:
    ARC-2: [5, 16, 20, 47, 48, 51, 53]
    ARC-1: [7, 10, 14, 16, 17, 18, 23, 26, 27, 29, 35, 43, 45, 48, 52, 53]

